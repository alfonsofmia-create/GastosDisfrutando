<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>C · Balance y tarjetas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE6; color: #22201C; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px; gap: 18px">
  <div style="background: #1F3A33; color: #F4EFE6; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; color: #BFD3CB">Octubre · gastado juntos 1.284 €</span>
    <span style="font-family: 'Fraunces', serif; font-size: 34px; line-height: 1.1; font-weight: 500">Sam te debe<br>42,30 €</span>
    <div style="display: flex; gap: 6px; height: 8px">
      <span style="flex: 54; background: #E9B872; border-radius: 4px"></span>
      <span style="flex: 46; background: #6FA393; border-radius: 4px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px">
      <span>Tú pagaste 694 €</span><span>Sam pagó 590 €</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700">Nuevo gasto</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button style="height: 64px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: #22201C; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span>{{c.name}}
        </button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px">
      <label style="flex: 2; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5E5850">Concepto
        <input type="text" value="Mercadona" style="height: 48px; border-radius: 12px; border: 1px solid #DDD5C7; padding: 0 12px; font: inherit; font-size: 16px; color: #22201C">
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5E5850">Importe
        <input type="text" inputmode="decimal" value="63,20 €" style="height: 48px; border-radius: 12px; border: 1px solid #DDD5C7; padding: 0 12px; font: inherit; font-size: 16px; font-weight: 700; color: #22201C; width: 100%; box-sizing: border-box">
      </label>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px">
      <span style="color: #5E5850">Pagó</span>
      <div style="display: flex; background: #F4EFE6; border-radius: 22px; padding: 3px">
        <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: none; background: #1F3A33; color: #F4EFE6; font-weight: 700">Tú</button>
        <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: none; background: transparent; color: #22201C">Sam</button>
      </div>
      <button style="height: 38px; padding: 0 12px; border-radius: 19px; border: 1px solid #DDD5C7; background: #FFFFFF; color: #22201C">50/50 ▾</button>
    </div>
    <button style="height: 52px; border-radius: 14px; border: none; background: #C4572E; color: #FFFFFF; font-size: 16px; font-weight: 700">Guardar gasto</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; font-weight: 700; color: #5E5850">Últimos</span>
    <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #DDD5C7"><span>Cena japonés · tú</span><span style="font-weight: 700">58,80 €</span></div>
    <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #DDD5C7"><span>Luz octubre · tú</span><span style="font-weight: 700">89,00 €</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = { border: '2px solid #1F3A33', bg: '#EAF1EE' };
    const off = { border: '1px solid #DDD5C7', bg: '#FFFFFF' };
    return { cats: [
      { name: 'Súper', dot: '#6FA393', ...sel },
      { name: 'Casa', dot: '#E9B872', ...off },
      { name: 'Ocio', dot: '#C4572E', ...off },
      { name: 'Otros', dot: '#8C8478', ...off }
    ] };
  }
}
</script>
</body>
</html>
