<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Actividad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFD43B; color: #111111; font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 10px; border-bottom: 3px solid #111111">
    <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid #111111; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; font-weight: 700">←</a>
    <span style="font-size: 22px; font-weight: 700; letter-spacing: 1px">ACTIVIDAD</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px; overflow-y: auto; min-height: 0">
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="border: 3px dashed #111111; padding: 24px; text-align: center; font-size: 14px; font-weight: 700">SIN MOVIMIENTOS TODAVÍA</div>
    </sc-if>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <span style="font-size: 13px; font-weight: 700; margin-top: 4px">&gt; {{d.label}}</span>
      <div style="background: #FFFFFF; border: 3px solid #111111; display: flex; flex-direction: column">
        <sc-for list="{{d.items}}" as="m" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 2px dashed #111111">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 15px; font-weight: 700">{{m.title}}</span>
              <span style="font-size: 12px">{{m.sub}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 700; color: {{m.color}}; white-space: nowrap">{{m.amount}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px solid #111111; background: #FFFFFF">
    <a href="Inicio.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      INICIO
    </a>
    <a href="Grupos.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111; font-size: 12px; border-left: 3px solid #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14c3 0 6 1.8 6 5"/></svg>
      GRUPOS
    </a>
    <a href="Actividad.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #111111; color: #FFD43B; font-size: 12px; font-weight: 700; border-left: 3px solid #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"/><path d="M3 21h18"/></svg>
      ACTIVIDAD
    </a>
    <a href="Cuenta.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111; font-size: 12px; border-left: 3px solid #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      CUENTA
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var EKEY = 'gastosdisfrutando.gastos', GKEY = 'gastosdisfrutando.grupos', PKEY = 'gastosdisfrutando.personas', AKEY = 'gastosdisfrutando.cuenta';
var SEED = [
  { id: 'g1', name: 'CHARMING LIFE', subs: [{ id: 's1', name: 'Casa' }, { id: 's2', name: 'Súper' }] },
  { id: 'g2', name: 'CHARMING TRAVELS', subs: [{ id: 's3', name: 'Roma 2026' }] }
];
function read(key, def) {
  try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : def; } catch (e) { return def; }
}
function eur(n) { return Math.abs(n).toFixed(2).replace('.', ',') + ' €'; }
function iso(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function dayLabel(date) {
  var now = new Date(), y = new Date(now.getTime() - 86400000);
  if (date === iso(now)) return 'HOY';
  if (date === iso(y)) return 'AYER';
  var p = date.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
class Component extends DCLogic {
  renderVals() {
    var G = '#1C6B3A', R = '#B3261E';
    var groups = read(GKEY, SEED), people = read(PKEY, []), me = (read(AKEY, {}) || {}).id;
    var list = read(EKEY, []).filter(function (x) { return x.shares; });
    list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var nameOf = function (id) { var p = people.filter(function (x) { return x.id === id; })[0]; return p ? p.name : '?'; };
    var days = [];
    list.forEach(function (x) {
      var label = dayLabel(x.date), day = days[days.length - 1];
      if (!day || day.label !== label) { day = { label: label, items: [] }; days.push(day); }
      var g = groups.filter(function (y) { return y.id === x.group; })[0] || { name: '—', subs: [] };
      var sub = (g.subs || []).filter(function (y) { return y.id === x.sub; })[0];
      var myShare = x.shares[me] || 0, item;
      // Desde tu punto de vista: lo que te deben (+), lo que debes (−) o neutro si no participas.
      if (x.payer === me) item = { amount: '+' + eur(x.amount - myShare), color: G };
      else if (myShare) item = { amount: '−' + eur(myShare), color: R };
      else item = { amount: eur(x.amount), color: '#111111' };
      item.title = x.concept;
      item.sub = (x.payer === me ? 'Pagaste tú' : 'Pagó ' + nameOf(x.payer)) + ' · ' + x.category + ' · ' + g.name + (sub ? ' / ' + sub.name : '');
      day.items.push(item);
    });
    return { days: days, empty: !days.length };
  }
}
</script>
</body>
</html>
