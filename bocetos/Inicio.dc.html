<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio · Grupos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#111111}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFD43B; color: #111111; font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 10px; border-bottom: 3px solid #111111">
    <span style="font-size: 22px; font-weight: 700; letter-spacing: 1px">GASTOS_DISFRUTANDO</span>
    <a href="NuevoGrupo.dc.html" aria-label="Crear grupo" style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid #111111; background: #FFFFFF; color: #111111; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="13" cy="8" r="3.5"/><path d="M6.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M4 7v6"/><path d="M1 10h6"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px">
    <div style="background: #111111; color: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 6px 6px 0 #FFFFFF">
      <span style="font-size: 12px; color: #FFD43B">EN GENERAL</span>
      <span style="font-size: 26px; font-weight: 700">DEBES 157,48 €</span>
    </div>

    <span style="font-size: 13px; font-weight: 700; margin-top: 6px">&gt; GRUPOS</span>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; background: #FFFFFF; border: 3px solid #111111">
        <label style="width: 76px; height: 86px; flex-shrink: 0; background: #111111; color: #FFD43B; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden">
          <input type="file" accept="image/*" aria-label="{{g.photoLabel}}" onChange="{{g.onPhoto}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <sc-if value="{{g.photo}}" hint-placeholder-val="{{false}}">
            <img src="{{g.photo}}" alt="" style="width: 100%; height: 100%; object-fit: cover">
          </sc-if>
          <sc-if value="{{g.noPhoto}}" hint-placeholder-val="{{true}}">
            <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
              FOTO
            </span>
          </sc-if>
        </label>
        <span style="flex-grow: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{g.name}}</span>
          <span style="font-size: 18px; font-weight: 700; color: {{g.color}}">{{g.balance}}</span>
          <span style="font-size: 12px">{{g.detail}}</span>
        </span>
      </div>
    </sc-for>

    <div style="flex-grow: 1"></div>
    <a href="AnadirGasto.dc.html" style="align-self: flex-end; text-decoration: none; height: 60px; box-sizing: border-box; padding: 0 22px; border: 3px solid #111111; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 700; box-shadow: 5px 5px 0 #FFFFFF; display: flex; align-items: center">+ AÑADIR GASTO</a>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 3px solid #111111; background: #FFFFFF">
    <a href="Grupos.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #111111; color: #FFD43B; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14c3 0 6 1.8 6 5"/></svg>
      GRUPOS
    </a>
    <a href="Actividad.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111; font-size: 12px; border-left: 3px solid #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"/><path d="M3 21h18"/></svg>
      ACTIVIDAD
    </a>
    <a href="Cuenta.dc.html" style="text-decoration: none; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111; font-size: 12px; border-left: 3px solid #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      CUENTA
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { photos: {} };
  }
  setPhoto(id, e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    this.setState({ photos: { ...this.state.photos, [id]: url } });
  }
  renderVals() {
    const base = [
      { id: 'life', name: 'CHARMING LIFE', balance: '+424,75 € TE DEBEN', color: '#1C6B3A', detail: 'Ana S. te debe 424,75' },
      { id: 'travels', name: 'CHARMING TRAVELS', balance: '−582,23 € DEBES', color: '#B3261E', detail: 'Debes a Ana S. 582,23' }
    ];
    const photos = this.state.photos;
    return {
      groups: base.map((g) => ({
        ...g,
        photo: photos[g.id] || '',
        noPhoto: !photos[g.id],
        photoLabel: 'Cambiar foto de ' + g.name,
        onPhoto: (e) => this.setPhoto(g.id, e)
      }))
    };
  }
}
</script>
</body>
</html>
